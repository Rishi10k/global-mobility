<mat-toolbar class="header">

    <a class="logo" routerLink="/">
        <mat-icon>public</mat-icon>
        <span>Global Mobility</span>
    </a>

    <span class="spacer"></span>

    <nav>

        <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Home
        </a>

        <a mat-button routerLink="/jobs" routerLinkActive="active">
            Jobs
        </a>

        <a mat-button routerLink="/countries" routerLinkActive="active">
            Countries
        </a>

        <a mat-button routerLink="/services" routerLinkActive="active">
            Services
        </a>

        <a mat-button routerLink="/about" routerLinkActive="active">
            About
        </a>

        <a mat-button routerLink="/contact" routerLinkActive="active">
            Contact
        </a>

    </nav>

    <span class="spacer-small"></span>

    <div class="auth-buttons">
        <button mat-stroked-button color="primary">
            Login
        </button>

        <button mat-flat-button color="primary">
            Register
        </button>
    </div>

</mat-toolbar>
